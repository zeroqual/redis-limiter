services:
  redis:
    image: redis:latest
    container_name: redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --requirepass 12345678 --appendonly yes
    restart: unless-stopped
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-dev-insight
    ports:
      - "5540:5540"
volumes:
  redis-data:
